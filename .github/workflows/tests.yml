name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Shell syntax
        run: bash -n analyze.sh cir-graph-docker scripts/build-clang.sh testbench/regenerate.sh
      - name: Unit tests and testbench (committed CIR, no LLVM build)
        run: python -m unittest discover -s tests -v
      - name: analyze.sh smoke test
        run: |
          ./analyze.sh testbench/cases/10_three_tu_chain --no-svg --output-dir out
          cir-graph-query summary --database out/graph.kuzu
          test -s out/graph.json && test -s out/graph.cypher
